<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Bite - المينيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #0f0f0f;
    --bg-2: #1a1a1a;
    --card-1: #252525;
    --card-2: #2d2d2d;
    --line: #ff6b35;
    --orange: #ff6b35;
    --gold: #ffd700;
    --ink: #ffffff;
    --muted: #999999;
    --danger: #ff5d6c;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 110px;
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  /* Header */
  header {
    background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
    border-bottom: 3px solid var(--orange);
    text-align: center;
    padding: 20px 16px 24px;
    position: relative;
  }
  .logo {
    width: 80px; height: 80px; border-radius: 50%;
    background: #fff; border: 3px solid #ff6b35;
    margin: 12px auto 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 8px 25px rgba(255,107,53,.4);
  }
  .logo span { font-weight: 800; font-size: 16px; color: #ff6b35; letter-spacing: 1px; }
  h1 { margin: 0; font-size: 32px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .tag { margin: 6px 0 0; color: #fff; font-size: 14px; font-weight: 600; }

  /* Main */
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 14px; }
  .intro {
    background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
    border-radius: 16px; padding: 16px; margin: 20px 0; text-align: center;
    box-shadow: 0 4px 15px rgba(255,107,53,.25);
  }
  .intro p { margin: 0; font-size: 15px; color: #fff; font-weight: 600; }

  /* Items Grid */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 20px;
  }
  .item {
    background: linear-gradient(135deg, var(--card-1), var(--card-2));
    border: 2px solid var(--line); border-radius: 16px; padding: 14px;
    text-align: center; transition: all .2s ease;
  }
  .item:active { transform: scale(.97); }
  .item.in-cart { border-color: var(--gold); background: linear-gradient(135deg, #3d3d00, #2d2d00); }
  .icon { font-size: 48px; margin: 8px 0; }
  .name { font-size: 16px; font-weight: 800; margin: 8px 0 4px; }
  .price { color: var(--orange); font-size: 18px; font-weight: 800; margin: 8px 0; }
  .qty-display { color: var(--gold); font-size: 13px; margin: 6px 0; font-weight: 700; }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn {
    flex: 1; padding: 8px 6px; border-radius: 10px; border: 0;
    font-weight: 700; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .btn-add {
    background: var(--orange); color: #fff;
  }
  .btn-add:active { transform: scale(.95); }
  .btn-qty {
    background: #3d3d3d; color: #fff; font-size: 16px; padding: 6px;
  }
  .btn-del {
    background: var(--danger); color: #fff;
  }

  /* Cart Bar */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(15,15,15,0), var(--bg) 40%);
    display: none;
  }
  .bar.show { display: block; }
  .bar button {
    display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 800px; margin: 0 auto;
    background: var(--orange); color: #fff; border: 0; border-radius: 14px;
    padding: 14px 18px; font-size: 16px; font-weight: 800;
    box-shadow: 0 8px 25px rgba(255,107,53,.35);
  }
  .bar .count { background: #fff; color: var(--orange); border-radius: 999px; padding: 2px 12px; font-size: 14px; }

  /* Sheet (Order Modal) */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 30; display: none; }
  .overlay.show { display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 800px; max-height: 88%; overflow: auto;
    background: var(--bg-2); border: 2px solid var(--orange); border-bottom: 0;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h2 { margin: 0 0 16px; font-size: 22px; display: flex; justify-content: space-between; align-items: center; color: var(--orange); }
  .sheet h2 button { background: none; border: 0; color: var(--muted); font-size: 28px; line-height: 1; }
  .line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #333; }
  .line .t { flex: 1; font-weight: 700; font-size: 15px; }
  .line .t small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; margin-top: 2px; }
  .line .p { color: var(--orange); font-weight: 800; white-space: nowrap; }
  .total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; padding: 16px 0 8px; border-top: 2px solid #333; color: var(--orange); }
  .field {
    width: 100%; margin: 10px 0; background: var(--bg); border: 2px solid #333; color: #fff;
    border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 15px;
  }
  .field::placeholder { color: #666; }
  .field:focus { outline: none; border-color: var(--orange); }
  .send {
    width: 100%; margin-top: 12px; background: var(--orange); color: #fff; border: 0;
    border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800;
    box-shadow: 0 4px 15px rgba(255,107,53,.3);
  }
  .send:active { transform: scale(.97); }
  .clear-all { width: 100%; margin-top: 10px; background: none; border: 0; color: var(--danger); font-weight: 700; padding: 10px; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 16px; }
  .toast {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--orange); color: #fff; font-weight: 700; padding: 12px 20px; border-radius: 999px;
    z-index: 40; display: none; font-size: 14px; box-shadow: 0 4px 15px rgba(255,107,53,.4);
  }

  @media (max-width: 420px) {
    h1 { font-size: 26px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span>BIG<br>BITE</span>
  </div>
  <h1>Big Bite</h1>
  <p class="tag">الطعم اللذيذ في كل لدغة 🍔</p>
</header>

<main class="wrap">
  <div class="intro">
    <p>🎯 اختر أطباقك المفضلة ورسل طلبك عبر واتس اب</p>
  </div>
  <div class="grid" id="list"></div>
</main>

<div class="bar" id="bar">
  <button id="openCart"><span>عرض الطلب <span class="count" id="cnt">0</span></span><span id="barTotal"></span></button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="طلبي">
    <h2>📋 طلبي <button id="closeCart" aria-label="إغلاق">×</button></h2>
    <div id="lines"></div>
    <div class="total"><span>المجموع</span><span id="sheetTotal">0</span></div>
    <input class="field" id="name" placeholder="اسمك (اختياري)">
    <input class="field" id="phone" placeholder="رقم الهاتف (اختياري)">
    <input class="field" id="note" placeholder="ملاحظات على الطلب (اختياري)">
    <button class="send" id="send">✉️ إرسال الطلب عبر واتس اب</button>
    <button class="clear-all" id="clearAll">إلغاء الطلب</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ إعدادات المطعم ============ */
const CONFIG = {
  name: "Big Bite",
  currency: "ل.س",
  whatsapp: "963951793762"  // ← ضع رقم واتس اب الكاشير هنا
};

/* ============ الأصناف ============ */
const ITEMS = [
  { id: 1, name: "بطاطا مقلية", desc: "مقرمشة ومملحة", price: 15000, icon: "🍟" },
  { id: 2, name: "شاورما دجاج", desc: "مع الخبز والثوم", price: 35000, icon: "🌮" },
  { id: 3, name: "شاورما لحم", desc: "لحم مشوي طازج", price: 40000, icon: "🥙" },
  { id: 4, name: "شيش طاووق", desc: "دجاج مشوي بالفحم", price: 38000, icon: "🍢" },
  { id: 5, name: "سودة اللحم", desc: "حمص مع لحم مشوي", price: 30000, icon: "🍲" },
  { id: 6, name: "سجق مشوي", desc: "سجق تركي مع الخبز", price: 25000, icon: "🌭" }
];

/* ============ المنطق ============ */
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US") + " " + CONFIG.currency;
const cart = {};

function renderList() {
  $("list").innerHTML = ITEMS.map(it => {
    const qty = cart[it.id] || 0;
    const actions = qty
      ? `<div class="actions">
          <button class="btn btn-qty" data-dec="${it.id}">−</button>
          <span class="qty-display">${qty}</span>
          <button class="btn btn-qty" data-inc="${it.id}">+</button>
          <button class="btn btn-del" data-cancel="${it.id}">حذف</button>
        </div>`
      : `<button class="btn btn-add" data-add="${it.id}">+ طلب</button>`;
    return `<article class="item ${qty ? "in-cart" : ""}">
      <div class="icon">${it.icon}</div>
      <h3 class="name">${it.name}</h3>
      <p style="font-size:12px; color:var(--muted); margin:4px 0;">${it.desc}</p>
      <div class="price">${fmt(it.price)}</div>
      ${actions}
    </article>`;
  }).join("");
}

function totals() {
  let n = 0, sum = 0;
  for (const id in cart) { 
    const it = ITEMS.find(x => x.id == id); 
    n += cart[id]; 
    sum += cart[id] * it.price; 
  }
  return { n, sum };
}

function renderBar() {
  const { n, sum } = totals();
  $("bar").classList.toggle("show", n > 0);
  $("cnt").textContent = n;
  $("barTotal").textContent = fmt(sum);
}

function renderSheet() {
  const { n, sum } = totals();
  if (!n) { closeCart(); return; }
  $("lines").innerHTML = Object.keys(cart).map(id => {
    const it = ITEMS.find(x => x.id == id);
    return `<div class="line">
      <div class="t">${it.name}<small>${cart[id]} × ${fmt(it.price)}</small></div>
      <div class="p">${fmt(cart[id] * it.price)}</div>
      <button class="btn btn-del" data-cancel="${id}" style="margin:0; width:auto; padding:6px 10px;">حذف</button>
    </div>`;
  }).join("");
  $("sheetTotal").textContent = fmt(sum);
}

function refresh() { 
  renderList(); 
  renderBar(); 
  if ($("overlay").classList.contains("show")) renderSheet(); 
}

function toast(msg) {
  const t = $("toast"); 
  t.textContent = msg; 
  t.style.display = "block";
  clearTimeout(toast.t); 
  toast.t = setTimeout(() => t.style.display = "none", 1500);
}

function openCart() { renderSheet(); $("overlay").classList.add("show"); }
function closeCart() { $("overlay").classList.remove("show"); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); 
  if (!b) return;
  const d = b.dataset;
  if (d.add) { cart[d.add] = 1; toast("✅ تم إضافة الصنف"); refresh(); }
  else if (d.inc) { cart[d.inc]++; refresh(); }
  else if (d.dec) { if (--cart[d.dec] <= 0) delete cart[d.dec]; refresh(); }
  else if (d.cancel) { delete cart[d.cancel]; toast("❌ تم حذف الصنف"); refresh(); }
});

$("openCart").addEventListener("click", openCart);
$("closeCart").addEventListener("click", closeCart);
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeCart(); });

$("clearAll").addEventListener("click", () => { 
  for (const k in cart) delete cart[k]; 
  toast("تم إلغاء الطلب"); 
  closeCart(); 
  refresh(); 
});

$("send").addEventListener("click", () => {
  const { sum } = totals();
  if (sum === 0) { toast("لا توجد أصناف في الطلب!"); return; }
  
  let msg = "🍔 طلب جديد من Big Bite\n\n";
  for (const id in cart) { 
    const it = ITEMS.find(x => x.id == id); 
    msg += `${it.icon} ${it.name} × ${cart[id]} = ${fmt(cart[id] * it.price)}\n`; 
  }
  msg += `\n💰 المجموع: ${fmt(sum)}`;
  
  const nm = $("name").value.trim();
  const ph = $("phone").value.trim();
  const nt = $("note").value.trim();
  
  if (nm) msg += `\n👤 الاسم: ${nm}`;
  if (ph) msg += `\n📱 الهاتف: ${ph}`;
  if (nt) msg += `\n📝 ملاحظات: ${nt}`;
  
  const url = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg);
  window.open(url, "_blank");
  
  setTimeout(() => {
    for (const k in cart) delete cart[k];
    $("name").value = "";
    $("phone").value = "";
    $("note").value = "";
    closeCart();
    refresh();
    toast("✅ تم إرسال الطلب!");
  }, 500);
});

renderList();
refresh();
</script>
</body>
</html>
